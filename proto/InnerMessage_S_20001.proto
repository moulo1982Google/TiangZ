//ResponseType L2S_RecoverPlayerLocations
// MapHost周期性重报自己仍持有的Unit，用于Location进程重启后的内存目录恢复。
// @ets.msg protocol=Location method=RecoverOwner
message S2L_RecoverPlayerLocations // IRequest
{
  string owner_name = 1;
  repeated PlayerLocationRecovery locations = 2;
  uint64 owner_generation = 3;
}

message L2S_RecoverPlayerLocations // IResponse
{
  uint32 recovered = 1;
  uint32 unchanged = 2;
  uint32 removed_stale = 3;
  bool owner_replaced = 4;
}

// Map在一个逻辑广播作业中交给同一Gate的多组客户端帧。
// 每组frame已经是最终客户端协议帧；Gate只解析目标Unit并扇出，不解码业务payload。
message ClientBroadcastBatchItem
{
  repeated uint32 target_unit_ids = 1;
  bytes frame = 2;
}

// @ets.msg protocol=Gate method=ClientBroadcastBatch
message S2G_ClientBroadcastBatch // IActorMessage
{
  repeated ClientBroadcastBatchItem batches = 1;
  // 1=reliable event, 2=replaceable latest state.
  uint32 delivery_class = 2;
}
