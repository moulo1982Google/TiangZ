  string gate_name = 2;
  reserved 3, 4;
  uint64 expected_location_revision = 5;
  uint64 target_map_instance_id = 6;
  uint64 character_id = 7;
}

message M2G_TransferPlayer // IActorResponse
{
  string account = 1;
  string map_host_name = 2;
  uint32 map_id = 3;
  uint64 map_instance_id = 4;
  uint32 unit_id = 5;
  uint32 actor_instance_id = 6;
  uint64 location_revision = 7;
  float x = 8;
  float z = 9;
  repeated MapEntitySnapshot entities = 10;
  uint32 fixed_update_ms = 11;
  repeated ItemSnapshot items = 12;
  float y = 13;
  MapHostEndpoint map_host = 14;
  repeated QuestSnapshot quests = 15;
  repeated uint32 completed_quest_config_ids = 16;
  uint64 character_id = 17;
  uint64 gold = 18;
  uint64 starter_dungeon_cooldown_end_at_ms = 19;
}

// @ets.msg protocol=Gate method=MapReady
message M2G_MapReady // IActorMessage
{
  string account = 1;
  uint32 map_id = 2;
  uint32 unit_id = 3;
  float x = 4;
  float z = 5;
  float y = 6;
  uint64 character_id = 7;
