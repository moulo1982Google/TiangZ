syntax = "proto3";

package ets.demo;

import "./DataDefine_CS_50001.proto";

//ResponseType M2G_EnterMap
// @ets.msg protocol=Map
message G2M_EnterMap // IRequest
{
  string account = 1;
  string token = 2;
  string gate_name = 3;
  reserved 4, 5;
  uint64 map_instance_id = 6;
  // Trusted server-side spawn override. Outer clients never write these fields.
  bool has_initial_spawn_override = 7;
  float initial_spawn_x = 8;
  float initial_spawn_y = 9;
  float initial_spawn_z = 10;
  float initial_spawn_yaw = 11;
}

//ResponseType M2G_SecondEnterMap
// 断线宽限期内重连只恢复客户端视图，不创建Unit、不重新进入AOI、不改绑Gate。
// @ets.msg protocol=Map method=SecondEnterMap
message G2M_SecondEnterMap // IActorRequest
{
  string account = 1;
  uint32 map_id = 2;
  uint32 unit_id = 3;
  string gate_name = 4;
}

message M2G_SecondEnterMap // IActorResponse
{
  string account = 1;
  uint32 map_id = 2;
  uint32 unit_id = 3;
  float x = 4;
  float z = 5;
  repeated MapEntitySnapshot entities = 6;
  uint32 fixed_update_ms = 7;
  repeated ItemSnapshot items = 8;
  float y = 9;
  uint64 map_instance_id = 10;
}

message M2G_EnterMap // IResponse
{
  string account = 1;
  uint32 map_id = 2;
  uint32 unit_id = 3;
  float x = 4;
  float z = 5;
  repeated MapEntitySnapshot entities = 6;
  uint32 actor_instance_id = 7;
  uint32 fixed_update_ms = 8;
  repeated ItemSnapshot items = 9;
  uint64 map_instance_id = 10;
  uint64 location_revision = 11;
  float y = 12;
}

//ResponseType M2G_TransferPlayer
// Gate始终调用源PlayerUnit，框架内部决定同MapHost或跨MapHost迁移。
// @ets.msg protocol=Map method=TransferPlayer
message G2M_TransferPlayer // IActorRequest
{
  string account = 1;
  string gate_name = 2;
  reserved 3, 4;
  uint64 expected_location_revision = 5;
  uint64 target_map_instance_id = 6;
}

message M2G_TransferPlayer // IActorResponse
{
  string account = 1;
  string map_host_name = 2;
  uint32 map_id = 3;
  uint64 map_instance_id = 4;
  uint32 unit_id = 5;
  uint32 actor_instance_id = 6;
  uint64 location_revision = 7;
  float x = 8;
  float z = 9;
  repeated MapEntitySnapshot entities = 10;
  uint32 fixed_update_ms = 11;
  repeated ItemSnapshot items = 12;
  float y = 13;
}

// @ets.msg protocol=Gate method=MapReady
message M2G_MapReady // IActorMessage
{
  string account = 1;
  uint32 map_id = 2;
  uint32 unit_id = 3;
  float x = 4;
  float z = 5;
  float y = 6;
}

//ResponseType M2G_PlayerOffline
// Gate确认重连宽限期结束后发起最终下线；Map完成保存、AOI离开和Unit销毁后响应。
// @ets.msg protocol=Map method=PlayerOffline
message G2M_PlayerOffline // IActorRequest
{
  string account = 1;
  uint32 map_id = 2;
  uint32 unit_id = 3;
  string gate_name = 4;
  string reason = 5;
}

message M2G_PlayerOffline // IActorResponse
{
  uint32 unit_id = 1;
  bool removed = 2;
}

// 所有服务器业务广播统一通过这一条内网消息到达 Gate。
// frame 已经是最终客户端帧，Gate 不再理解 Move、技能等业务消息。
// @ets.msg protocol=Gate method=ClientBroadcast
message S2G_ClientBroadcast // IActorMessage
{
  repeated uint32 target_unit_ids = 1;
  bytes frame = 2;
}

message KickPlayerTarget
{
  uint32 unit_id = 1;
  reserved 2;
}

// Map 批量摘除玩家长期路由；Gate随后关闭其当前物理连接。
// @ets.msg protocol=Gate method=KickPlayers
message M2G_KickPlayers // IActorMessage
{
  repeated KickPlayerTarget players = 1;
  string reason = 2;
}

// 跨进程地图迁移的可序列化业务快照。它不包含TS构造函数、Rust handle、Timer或Promise。
message PlayerTransferSnapshot
{
  uint32 schema_version = 1;
  string transfer_id = 2;
  uint32 unit_id = 3;
  string account = 4;
  uint32 source_map_id = 5;
  uint32 target_map_id = 6;
  string gate_name = 7;
  reserved 8;
  float speed_cells_per_second = 9;
  uint32 facing = 10;
  bool alive = 11;
  repeated UnitNumericDelta numerics = 12;
  repeated ItemSnapshot items = 13;
  uint64 source_map_instance_id = 14;
  uint64 target_map_instance_id = 15;
}

message MapInstanceSnapshot
{
  uint64 map_instance_id = 1;
  uint32 map_config_id = 2;
  string map_host_name = 3;
  bool dynamic = 4;
}

//ResponseType L2S_ResolveMapInstance
// @ets.msg protocol=MapInstance method=Resolve
message S2L_ResolveMapInstance // IRequest
{
  uint64 map_instance_id = 1;
}

message L2S_ResolveMapInstance // IResponse
{
  bool found = 1;
  MapInstanceSnapshot instance = 2;
}

//ResponseType L2S_RegisterMapInstance
// @ets.msg protocol=MapInstance method=Register
message S2L_RegisterMapInstance // IRequest
{
  MapInstanceSnapshot instance = 1;
}

message L2S_RegisterMapInstance // IResponse
{
  MapInstanceSnapshot instance = 1;
  bool created = 2;
}

//ResponseType L2S_RemoveMapInstance
// @ets.msg protocol=MapInstance method=Remove
message S2L_RemoveMapInstance // IRequest
{
  uint64 map_instance_id = 1;
  string expected_map_host_name = 2;
}

message L2S_RemoveMapInstance // IResponse
{
  bool removed = 1;
}

//ResponseType M2S_CreateDynamicMap
// @ets.msg protocol=DynamicMap method=Create
message S2M_CreateDynamicMap // IRequest
{
  uint32 map_config_id = 1;
}

message M2S_CreateDynamicMap // IResponse
{
  MapInstanceSnapshot instance = 1;
}

//ResponseType M2S_DisposeDynamicMap
// @ets.msg protocol=DynamicMap method=Dispose
message S2M_DisposeDynamicMap // IRequest
{
  uint64 map_instance_id = 1;
}

message M2S_DisposeDynamicMap // IResponse
{
  bool disposed = 1;
}

//ResponseType M2M_PreparePlayerTransferResponse
// @ets.msg protocol=MapTransfer method=Prepare
message M2M_PreparePlayerTransfer // IRequest
{
  PlayerTransferSnapshot snapshot = 1;
}

message M2M_PreparePlayerTransferResponse // IResponse
{
  string transfer_id = 1;
  string stage = 2;
  uint32 actor_instance_id = 3;
}

//ResponseType M2M_CommitPlayerTransferResponse
// @ets.msg protocol=MapTransfer method=Commit
message M2M_CommitPlayerTransfer // IRequest
{
  string transfer_id = 1;
}

message M2M_CommitPlayerTransferResponse // IResponse
{
  string transfer_id = 1;
  bool newly_committed = 2;
  uint32 map_id = 3;
  uint32 unit_id = 4;
  uint32 actor_instance_id = 5;
  float x = 6;
  float z = 7;
  repeated MapEntitySnapshot entities = 8;
  uint32 fixed_update_ms = 9;
  repeated ItemSnapshot items = 10;
  string map_host_name = 11;
  uint64 map_instance_id = 12;
  float y = 13;
}

//ResponseType M2M_AbortPlayerTransferResponse
// @ets.msg protocol=MapTransfer method=Abort
message M2M_AbortPlayerTransfer // IRequest
{
  string transfer_id = 1;
}

message M2M_AbortPlayerTransferResponse // IResponse
{
  string transfer_id = 1;
  bool newly_aborted = 2;
}

// Location只保存路由元数据，不包含connectionId和玩家业务状态。
message PlayerLocationSnapshot
{
  uint32 unit_id = 1;
  string account = 2;
  string gate_name = 3;
  string map_host_name = 4;
  uint32 map_id = 5;
  uint64 map_instance_id = 6;
  uint32 actor_instance_id = 7;
  uint64 revision = 8;
  string state = 9;
}

//ResponseType L2S_AllocatePlayerUnitId
// Demo尚无账号数据库时由Location统一分配UnitId，避免多MapHost各自自增冲突。
// @ets.msg protocol=Location method=AllocateUnitId
message S2L_AllocatePlayerUnitId // IRequest
{
  string account = 1;
}

message L2S_AllocatePlayerUnitId // IResponse
{
  uint32 unit_id = 1;
}

//ResponseType L2S_RegisterPlayerLocation
// @ets.msg protocol=Location method=Register
message S2L_RegisterPlayerLocation // IRequest
{
  uint32 unit_id = 1;
  string account = 2;
  string gate_name = 3;
  string map_host_name = 4;
  uint32 map_id = 5;
  uint64 map_instance_id = 6;
  uint32 actor_instance_id = 7;
}

message L2S_RegisterPlayerLocation // IResponse
{
  PlayerLocationSnapshot location = 1;
  bool created = 2;
}

//ResponseType L2S_ResolvePlayerLocation
// @ets.msg protocol=Location method=Resolve
message S2L_ResolvePlayerLocation // IRequest
{
  uint32 unit_id = 1;
  string account = 2;
}

message L2S_ResolvePlayerLocation // IResponse
{
  bool found = 1;
  PlayerLocationSnapshot location = 2;
}

//ResponseType L2S_ResolvePlayerLocations
// @ets.msg protocol=Location method=ResolveMany
message S2L_ResolvePlayerLocations // IRequest
{
  repeated uint32 unit_ids = 1;
}

message L2S_ResolvePlayerLocations // IResponse
{
  repeated PlayerLocationSnapshot locations = 1;
}

//ResponseType L2S_LockPlayerLocation
// @ets.msg protocol=Location method=Lock
message S2L_LockPlayerLocation // IRequest
{
  uint32 unit_id = 1;
  uint64 expected_revision = 2;
  uint32 expected_actor_instance_id = 3;
  string operation_id = 4;
  string state = 5;
}

message L2S_LockPlayerLocation // IResponse
{
  PlayerLocationSnapshot location = 1;
}

//ResponseType L2S_CommitPlayerLocation
// @ets.msg protocol=Location method=Commit
message S2L_CommitPlayerLocation // IRequest
{
  uint32 unit_id = 1;
  string operation_id = 2;
  string gate_name = 3;
  string map_host_name = 4;
  uint32 map_id = 5;
  uint64 map_instance_id = 6;
  uint32 actor_instance_id = 7;
}

message L2S_CommitPlayerLocation // IResponse
{
  PlayerLocationSnapshot location = 1;
}

//ResponseType L2S_UnlockPlayerLocation
// @ets.msg protocol=Location method=Unlock
message S2L_UnlockPlayerLocation // IRequest
{
  uint32 unit_id = 1;
  string operation_id = 2;
}

message L2S_UnlockPlayerLocation // IResponse
{
  PlayerLocationSnapshot location = 1;
}

//ResponseType L2S_RemovePlayerLocation
// @ets.msg protocol=Location method=Remove
message S2L_RemovePlayerLocation // IRequest
{
  uint32 unit_id = 1;
  string operation_id = 2;
}

message L2S_RemovePlayerLocation // IResponse
{
  bool removed = 1;
}

message PlayerLocationRecovery
{
  uint32 unit_id = 1;
  string account = 2;
  string gate_name = 3;
  string map_host_name = 4;
  uint32 map_id = 5;
  uint64 map_instance_id = 6;
  uint32 actor_instance_id = 7;
}

//ResponseType L2S_RecoverPlayerLocations
// MapHost周期性重报自己仍持有的Unit，用于Location进程重启后的内存目录恢复。
// @ets.msg protocol=Location method=RecoverOwner
message S2L_RecoverPlayerLocations // IRequest
{
  string owner_name = 1;
  repeated PlayerLocationRecovery locations = 2;
}

message L2S_RecoverPlayerLocations // IResponse
{
  uint32 recovered = 1;
  uint32 unchanged = 2;
}
