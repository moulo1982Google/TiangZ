//ResponseType M2G_InitialSnapshot
// Gate在客户端确认初始视野已就绪后，请MapHost发送一次初始快照。
// @ets.msg protocol=Map method=InitialSnapshot
message G2M_InitialSnapshot // IRequest
{
  string account = 1;
  uint32 unit_id = 2;
  uint64 character_id = 3;
}

message M2G_InitialSnapshot // IResponse
{
  bool demo_door_closed = 1;
}

//ResponseType M2G_PlayerOffline
// Gate确认重连宽限期结束后发起最终下线；Map完成保存、AOI离开和Unit销毁后响应。
// @ets.msg protocol=Map method=PlayerOffline
message G2M_PlayerOffline // IActorRequest
{
  string account = 1;
  uint32 map_id = 2;
  uint32 unit_id = 3;
  string gate_name = 4;
  string reason = 5;
  uint64 character_id = 6;
  uint64 gate_epoch = 7;
}

message M2G_PlayerOffline // IActorResponse
{
  uint32 unit_id = 1;
  bool removed = 2;
}

// 所有服务器业务广播统一通过这一条内网消息到达 Gate。
// frame 已经是最终客户端帧，Gate 不再理解 Move、技能等业务消息。
// @ets.msg protocol=Gate method=ClientBroadcast
message S2G_ClientBroadcast // IActorMessage
{
  repeated uint32 target_unit_ids = 1;
  bytes frame = 2;
  // 1=reliable event, 2=replaceable latest state.
  uint32 delivery_class = 3;
}

message KickPlayerTarget
{
  uint32 unit_id = 1;
  reserved 2;
}

// Map 批量摘除玩家长期路由；Gate随后关闭其当前物理连接。
// @ets.msg protocol=Gate method=KickPlayers
message M2G_KickPlayers // IActorMessage
{
  repeated KickPlayerTarget players = 1;
  string reason = 2;
}

// 跨进程地图迁移的可序列化业务快照。它不包含TS构造函数、Rust handle、Timer或Promise。
message PlayerTransferSnapshot
{
  uint32 schema_version = 1;
  string transfer_id = 2;
  uint32 unit_id = 3;
  string account = 4;
  uint32 source_map_id = 5;
  uint32 target_map_id = 6;
  string gate_name = 7;
  reserved 8;
  float speed_cells_per_second = 9;
  uint32 facing = 10;
  bool alive = 11;
  repeated UnitNumericDelta numerics = 12;
  repeated ItemSnapshot items = 13;
  uint64 source_map_instance_id = 14;
  uint64 target_map_instance_id = 15;
  repeated BuffTransferSnapshot buffs = 16;
  SkillTransferSnapshot skill = 17;
  repeated QuestSnapshot quests = 18;
  repeated uint32 completed_quest_config_ids = 19;
  // DBProxy乐观并发版本；随玩家迁移，防止目标MapHost用旧快照覆盖新数据。
  // 旧聚合revision保留协议位但不再参与写入，新客户端应读取三个领域revision。
  uint64 persistence_revision = 20;
  uint64 character_id = 21;
  uint64 gold = 22;
  // 旧economy revision不再使用；新领域使用独立字段，避免复用已经发布的编号。
  reserved 23;
  uint64 progression_revision = 24;
  uint64 runtime_revision = 25;
  uint64 wallet_revision = 26;
  uint64 inventory_revision = 27;
  uint64 quest_revision = 28;
  StarterDungeonCooldownSnapshot starter_dungeon = 29;
  uint64 gate_epoch = 30;
}

message MapInstanceSnapshot
{
  uint64 map_instance_id = 1;
  uint32 map_config_id = 2;
  string map_host_name = 3;
  bool dynamic = 4;
  MapHostEndpoint map_host = 5;
}

// MapHost向MapManager报告的可调用内网地址。该地址只用于Manager下发创建命令。
message MapHostEndpoint
{
  string name = 1;
  string ip = 2;
  uint32 port = 3;
  string protocol = 4;
  string audience = 5;
}

// MapHost保留的幂等创建关系；MapManager重启后可由注册消息恢复。
message DynamicMapAssignmentSnapshot
{
  string request_id = 1;
  uint32 map_config_id = 2;
  uint64 map_instance_id = 3;
}

