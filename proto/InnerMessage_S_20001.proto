syntax = "proto3";

package ets.demo;

import "./DataDefine_CS_50001.proto";

//ResponseType M2G_EnterMap
// @ets.msg protocol=Map
message G2M_EnterMap // IRequest
{
  string account = 1;
  string token = 2;
  string gate_name = 3;
  reserved 4, 5;
  uint64 map_instance_id = 6;
  // Trusted server-side spawn override. Outer clients never write these fields.
  bool has_initial_spawn_override = 7;
  float initial_spawn_x = 8;
  float initial_spawn_y = 9;
  float initial_spawn_z = 10;
  float initial_spawn_yaw = 11;
  // Trusted diagnostic value from the Bench Gate handler. Production entry always uses 0=full.
  uint32 entry_sync_mode = 12;
  uint64 character_id = 13;
  uint64 gate_epoch = 14;
}

//ResponseType M2G_SecondEnterMap
// 同一Gate内重连只恢复客户端视图，不创建Unit、不重新进入AOI。
// @ets.msg protocol=Map method=SecondEnterMap
message G2M_SecondEnterMap // IActorRequest
{
  string account = 1;
  uint32 map_id = 2;
  uint32 unit_id = 3;
  string gate_name = 4;
  uint64 character_id = 5;
  uint64 gate_epoch = 6;
}

message M2G_SecondEnterMap // IActorResponse
{
  string account = 1;
  uint32 map_id = 2;
  uint32 unit_id = 3;
  float x = 4;
  float z = 5;
  repeated MapEntitySnapshot entities = 6;
  uint32 fixed_update_ms = 7;
  repeated ItemSnapshot items = 8;
  float y = 9;
  uint64 map_instance_id = 10;
  repeated QuestSnapshot quests = 11;
  repeated uint32 completed_quest_config_ids = 12;
  uint64 character_id = 13;
  uint64 gold = 14;
  uint64 starter_dungeon_cooldown_end_at_ms = 15;
}

//ResponseType M2G_RebindPlayerGate
// Gate故障转移在PlayerUnit有序邮箱内提交Location CAS并切换下行路由。
// @ets.msg protocol=Map method=RebindPlayerGate
message G2M_RebindPlayerGate // IActorRequest
{
  string account = 1;
  uint64 character_id = 2;
  uint32 unit_id = 3;
  string expected_gate_name = 4;
  string next_gate_name = 5;
  uint64 expected_gate_epoch = 6;
  uint64 expected_location_revision = 7;
  string operation_id = 8;
}

message M2G_RebindPlayerGate // IActorResponse
{
  string gate_name = 1;
  uint64 gate_epoch = 2;
  uint64 location_revision = 3;
}

//ResponseType G2S_ProbeGate
// 只允许Inner Scene调用的轻量存活探针；客户端心跳继续使用C2G_Ping。
// @ets.msg protocol=Gate method=Probe
message S2G_ProbeGate // IRequest
{
  string requester = 1;
}

message G2S_ProbeGate // IResponse
{
  string gate_name = 1;
}

message M2G_EnterMap // IResponse
{
  string account = 1;
  uint32 map_id = 2;
  uint32 unit_id = 3;
  float x = 4;
  float z = 5;
  repeated MapEntitySnapshot entities = 6;
  uint32 actor_instance_id = 7;
  uint32 fixed_update_ms = 8;
  repeated ItemSnapshot items = 9;
  uint64 map_instance_id = 10;
  uint64 location_revision = 11;
  float y = 12;
  repeated QuestSnapshot quests = 13;
  repeated uint32 completed_quest_config_ids = 14;
  uint64 character_id = 15;
  uint64 gold = 16;
  uint64 starter_dungeon_cooldown_end_at_ms = 17;
}

//ResponseType M2G_ClaimStarterDungeonEntry
// 在当前PlayerUnit有序邮箱中幂等提交个人副本CD，Gate不得在本地保存该状态。
// Commits the personal dungeon cooldown idempotently in the current PlayerUnit ordered mailbox.
// @ets.msg protocol=Map method=ClaimStarterDungeonEntry
message G2M_ClaimStarterDungeonEntry // IActorRequest
{
  string operation_id = 1;
}

message M2G_ClaimStarterDungeonEntry // IActorResponse
{
  uint64 cooldown_end_at_ms = 1;
}

//ResponseType M2G_TransferPlayer
// Gate始终调用源PlayerUnit，框架内部决定同MapHost或跨MapHost迁移。
// @ets.msg protocol=Map method=TransferPlayer
