syntax = "proto3";

package ets.demo;

import "./DataDefine_CS_50001.proto";

//ResponseType S2C_GetLoginServiceAddr
// @ets.msg protocol=LoginMgr
message C2S_GetLoginServiceAddr // IRequest
{
}

message S2C_GetLoginServiceAddr // IResponse
{
  string name = 1;
  string ip = 2;
  uint32 port = 3;
}

//ResponseType S2C_Login
// @ets.msg protocol=Login
message C2S_Login // IRequest
{
  string account = 1;
}

message S2C_Login // IResponse
{
  string account = 1;
  string service = 2;
  uint32 login_count = 3;
  string token = 4;
  string gate_name = 5;
  string gate_ip = 6;
  uint32 gate_port = 7;
}

//ResponseType G2C_LoginGate
// @ets.msg protocol=Gate
message C2G_LoginGate // IRequest
{
  string account = 1;
  string token = 2;
}

message G2C_LoginGate // IResponse
{
  string account = 1;
}

//ResponseType G2C_EnterMap
// @ets.msg protocol=Gate
message C2G_EnterMap // IRequest
{
  uint32 map_id = 1;
  // Demo允许直接指定运行实例以验证动态副本；业务项目应先完成队伍/副本权限校验。
  uint64 map_instance_id = 2;
}

message G2C_EnterMap // IResponse
{
  string account = 1;
  string map_service = 2;
  uint32 map_id = 3;
  uint32 unit_id = 4;
  float x = 5;
  float z = 6;
  repeated MapEntitySnapshot entities = 7;
  uint32 fixed_update_ms = 8;
  repeated ItemSnapshot items = 9;
  float y = 10;
  uint64 map_instance_id = 11;
  uint32 spatial_mode = 12;
  string navigation_version = 13;
  string navigation_hash = 14;
}

// @ets.msg protocol=Client method=MapReady
message G2C_MapReady // IMessage
{
  string account = 1;
  uint32 map_id = 2;
  uint32 unit_id = 3;
  float x = 4;
  float z = 5;
  float y = 6;
}

//ResponseType G2C_MapSnapshotReady
// 客户端完成地图对象和初始视野监听注册后确认；Gate随后请求MapHost发送初始快照。
// @ets.msg protocol=Gate method=MapSnapshotReady
message C2G_MapSnapshotReady // IRequest
{
  uint32 unit_id = 1;
}

message G2C_MapSnapshotReady // IResponse
{
}

// @ets.msg protocol=Map method=Move duringTransfer=drop
message C2M_Move // IActorLocationMessage
{
  sint32 input_x = 1;
  sint32 input_z = 2;
  uint32 sequence = 3;
}

//ResponseType M2C_MapProbe
// @ets.msg protocol=Map method=Probe duringTransfer=reject
message C2M_MapProbe // IActorLocationRequest
{
  uint32 sequence = 1;
}

message M2C_MapProbe // IActorLocationResponse
{
  uint32 sequence = 1;
}

//ResponseType M2C_FindPath
// 只查询服务端NavMesh路径，不修改玩家权威位置；持续移动由独立的3D移动协议负责。
// @ets.msg protocol=Map method=FindPath duringTransfer=reject
message C2M_FindPath // IActorLocationRequest
{
  float start_x = 1;
  float start_y = 2;
  float start_z = 3;
  float target_x = 4;
  float target_y = 5;
  float target_z = 6;
}

message M2C_FindPath // IActorLocationResponse
{
  repeated NavigationPathPoint points = 1;
}

//ResponseType M2C_NavigateTo
// 设置NavMesh3D权威移动目标；Rust一次寻路并持有路径，TS不保存跨帧路径状态。
// @ets.msg protocol=Map method=NavigateTo duringTransfer=reject
message C2M_NavigateTo // IActorLocationRequest
{
  float target_x = 1;
  float target_y = 2;
  float target_z = 3;
  uint32 sequence = 4;
}

message M2C_NavigateTo // IActorLocationResponse
{
  uint32 acknowledged_sequence = 1;
  repeated NavigationPathPoint points = 2;
}

//ResponseType M2C_NavigateInput
// 提交相对角色朝向的方向输入；零输入会立即停止Rust持有的路径。
// @ets.msg protocol=Map method=NavigateInput duringTransfer=reject
message C2M_NavigateInput // IActorLocationRequest
{
  sint32 forward = 1;
  sint32 strafe = 2;
  float yaw = 3;
  uint32 sequence = 4;
}

message M2C_NavigateInput // IActorLocationResponse
{
  uint32 acknowledged_sequence = 1;
  repeated NavigationPathPoint points = 2;
}

// @ets.msg protocol=Client method=EntityMove
// @ets.broadcast mode=latest item=CellMovementState items=movements key=unit_id tick=server_tick
message G2C_EntityMove // IMessage
{
  uint32 server_tick = 1;
  repeated CellMovementState movements = 2;
}

// @ets.msg protocol=Client method=EntityNavigate
// @ets.broadcast mode=latest item=NavigationMovementState items=movements key=unit_id tick=server_tick
message G2C_EntityNavigate // IMessage
{
  uint32 server_tick = 1;
  repeated NavigationMovementState movements = 2;
}

// @ets.msg protocol=Client method=EntityNumeric
// @ets.broadcast mode=latest item=UnitNumericDelta items=numerics key=unit_id,numeric_type tick=server_tick
message G2C_EntityNumeric // IMessage
{
  uint32 server_tick = 1;
  repeated UnitNumericDelta numerics = 2;
}

// @ets.msg protocol=Client method=EntityState
// @ets.broadcast mode=latest item=UnitStateDelta items=states key=unit_id tick=server_tick
message G2C_EntityState // IMessage
{
  uint32 server_tick = 1;
  repeated UnitStateDelta states = 2;
}

//ResponseType M2C_UseItem
// @ets.msg protocol=Map method=UseItem duringTransfer=queue
message C2M_UseItem // IActorLocationRequest
{
  uint64 item_id = 1;
}

message M2C_UseItem // IActorLocationResponse
{
  ItemSnapshot item = 1;
}

// @ets.msg protocol=Client method=ItemChanged
// @ets.broadcast mode=event
message G2C_ItemChanged // IMessage
{
  ItemSnapshot item = 1;
}

// Buff创建是不可覆盖事件；普通AOI玩家、自己和队伍成员都只从这里获得公开外观。
// @ets.msg protocol=Client method=BuffAdded
// @ets.broadcast mode=event
message G2C_BuffAdded // IMessage
{
  BuffPublicView buff = 1;
}

// Buff移除是不可覆盖事件；客户端用revision拒绝迟到的详情状态。
// @ets.msg protocol=Client method=BuffRemoved
// @ets.broadcast mode=event
message G2C_BuffRemoved // IMessage
{
  uint32 unit_id = 1;
  uint64 buff_instance_id = 2;
  uint32 revision = 3;
}

// 吸收量等私有详情允许帧内覆盖，只发给自己、队友或团队成员。
// @ets.msg protocol=Client method=BuffDetail
// @ets.broadcast mode=latest item=BuffDetailView items=buffs key=unit_id,buff_instance_id tick=server_tick
message G2C_BuffDetail // IMessage
{
  uint32 server_tick = 1;
  repeated BuffDetailView buffs = 2;
}

// @ets.msg protocol=Client method=EntityEnter
// @ets.broadcast mode=event
message G2C_EntityEnter // IMessage
{
  MapEntitySnapshot entity = 1;
}

// @ets.msg protocol=Client method=EntityLeave
// @ets.broadcast mode=event
message G2C_EntityLeave // IMessage
{
  uint32 unit_id = 1;
}

// @ets.msg protocol=Client method=AoiDelta
// @ets.broadcast mode=event
message G2C_AoiDelta // IMessage
{
  uint32 server_tick = 1;
  repeated MapEntitySnapshot enters = 2;
  repeated uint32 leaves = 3;
}

//ResponseType G2C_Ping
// @ets.msg protocol=Gate method=Ping
message C2G_Ping // IRequest
{
}

message G2C_Ping // IResponse
{
  // Gate生成响应时的Unix毫秒时间。
  int64 server_time = 1;
}
