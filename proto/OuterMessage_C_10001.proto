syntax = "proto3";

package ets.demo;

import "./DataDefine_CS_50001.proto";

//ResponseType S2C_GetLoginServiceAddr
// @ets.msg protocol=LoginMgr
message C2S_GetLoginServiceAddr // IRequest
{
}

message S2C_GetLoginServiceAddr // IResponse
{
  string name = 1;
  string ip = 2;
  uint32 port = 3;
}

//ResponseType S2C_Login
// @ets.msg protocol=Login
message C2S_Login // IRequest
{
  string account = 1;
}

message S2C_Login // IResponse
{
  string account = 1;
  string service = 2;
  uint32 login_count = 3;
  string token = 4;
  string gate_name = 5;
  string gate_ip = 6;
  uint32 gate_port = 7;
}

//ResponseType G2C_LoginGate
// @ets.msg protocol=Gate
message C2G_LoginGate // IRequest
{
  string account = 1;
  string token = 2;
}

message G2C_LoginGate // IResponse
{
  string account = 1;
}

//ResponseType G2C_EnterMap
// @ets.msg protocol=Gate
message C2G_EnterMap // IRequest
{
  uint32 map_id = 1;
}

message G2C_EnterMap // IResponse
{
  string account = 1;
  string map_service = 2;
  uint32 map_id = 3;
  uint32 unit_id = 4;
  sint32 x = 5;
  sint32 y = 6;
  repeated MapEntitySnapshot entities = 7;
  uint32 fixed_update_ms = 8;
  repeated ItemSnapshot items = 9;
}

// @ets.msg protocol=Client method=MapReady
message G2C_MapReady // IMessage
{
  string account = 1;
  uint32 map_id = 2;
  uint32 unit_id = 3;
  sint32 x = 4;
  sint32 y = 5;
}

// @ets.msg protocol=Map method=Move
message C2M_Move // IActorLocationMessage
{
  sint32 input_x = 1;
  sint32 input_y = 2;
  uint32 sequence = 3;
}

//ResponseType M2C_MapProbe
// @ets.msg protocol=Map method=Probe
message C2M_MapProbe // IActorLocationRequest
{
  uint32 sequence = 1;
}

message M2C_MapProbe // IActorLocationResponse
{
  uint32 sequence = 1;
}

// @ets.msg protocol=Client method=EntityMove
// @ets.broadcast mode=latest item=CellMovementState items=movements key=unit_id tick=server_tick
message G2C_EntityMove // IMessage
{
  uint32 server_tick = 1;
  repeated CellMovementState movements = 2;
}

// @ets.msg protocol=Client method=EntityNumeric
// @ets.broadcast mode=latest item=UnitNumericDelta items=numerics key=unit_id,numeric_type tick=server_tick
message G2C_EntityNumeric // IMessage
{
  uint32 server_tick = 1;
  repeated UnitNumericDelta numerics = 2;
}

// @ets.msg protocol=Client method=EntityState
// @ets.broadcast mode=latest item=UnitStateDelta items=states key=unit_id tick=server_tick
message G2C_EntityState // IMessage
{
  uint32 server_tick = 1;
  repeated UnitStateDelta states = 2;
}

//ResponseType M2C_UseItem
// @ets.msg protocol=Map method=UseItem
message C2M_UseItem // IActorLocationRequest
{
  uint32 item_id = 1;
}

message M2C_UseItem // IActorLocationResponse
{
  ItemSnapshot item = 1;
}

// @ets.msg protocol=Client method=ItemChanged
// @ets.broadcast mode=event
message G2C_ItemChanged // IMessage
{
  ItemSnapshot item = 1;
}

// @ets.msg protocol=Client method=EntityEnter
// @ets.broadcast mode=event
message G2C_EntityEnter // IMessage
{
  MapEntitySnapshot entity = 1;
}

// @ets.msg protocol=Client method=EntityLeave
// @ets.broadcast mode=event
message G2C_EntityLeave // IMessage
{
  uint32 unit_id = 1;
}

// @ets.msg protocol=Gate method=Ping
message C2G_Ping // IMessage
{
}
