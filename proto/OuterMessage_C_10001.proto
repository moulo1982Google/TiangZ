syntax = "proto3";

package ets.demo;

import "./DataDefine_CS_50001.proto";

//ResponseType S2C_GetLoginServiceAddr
// @ets.msg protocol=LoginMgr
message C2S_GetLoginServiceAddr // IRequest
{
  optional string account = 1;
}

message S2C_GetLoginServiceAddr // IResponse
{
  string name = 1;
  string ip = 2;
  uint32 port = 3;
}

//ResponseType S2C_Login
// @ets.msg protocol=Login
message C2S_Login // IRequest
{
  string account = 1;
  optional uint64 character_id = 2;
  optional string password = 3;
}

message CharacterSummary
{
  uint64 character_id = 1;
  string name = 2;
  uint32 player_config_id = 3;
  uint32 level = 4;
}

message S2C_Login // IResponse
{
  string account = 1;
  string service = 2;
  uint32 login_count = 3;
  string token = 4;
  string gate_name = 5;
  string gate_ip = 6;
  uint32 gate_port = 7;
  repeated CharacterSummary characters = 8;
  uint64 selected_character_id = 9;
}

//ResponseType S2C_Register
// @ets.msg protocol=Login method=Register
message C2S_Register // IRequest
{
  string account = 1;
  string password = 2;
}

message S2C_Register // IResponse
{
  string account = 1;
  CharacterSummary character = 2;
}

//ResponseType S2C_CreateCharacter
// @ets.msg protocol=Login method=CreateCharacter
message C2S_CreateCharacter // IRequest
{
  string account = 1;
  string name = 2;
  uint32 player_config_id = 3;
}

message S2C_CreateCharacter // IResponse
{
  CharacterSummary character = 1;
  repeated CharacterSummary characters = 2;
}

//ResponseType G2C_LoginGate
// @ets.msg protocol=Gate
message C2G_LoginGate // IRequest
{
  string account = 1;
  string token = 2;
  optional uint64 character_id = 3;
}

message G2C_LoginGate // IResponse
{
  string account = 1;
  uint64 character_id = 2;
}

//ResponseType G2C_EnterMap
// @ets.msg protocol=Gate
message C2G_EnterMap // IRequest
{
  uint32 map_id = 1;
  // Demo允许直接指定运行实例以验证动态副本；业务项目应先完成队伍/副本权限校验。
  uint64 map_instance_id = 2;
}

message G2C_EnterMap // IResponse
{
  string account = 1;
  string map_service = 2;
  uint32 map_id = 3;
  uint32 unit_id = 4;
  float x = 5;
  float z = 6;
  repeated MapEntitySnapshot entities = 7;
  uint32 fixed_update_ms = 8;
  repeated ItemSnapshot items = 9;
  float y = 10;
  uint64 map_instance_id = 11;
  uint32 spatial_mode = 12;
  string navigation_version = 13;
  string navigation_hash = 14;
  repeated QuestSnapshot quests = 15;
  repeated uint32 completed_quest_config_ids = 16;
}

// @ets.msg protocol=Client method=MapReady
message G2C_MapReady // IMessage
{
  string account = 1;
  uint32 map_id = 2;
  uint32 unit_id = 3;
  float x = 4;
  float z = 5;
  float y = 6;
}

// 账号在新连接登录后，旧连接收到该通知并随后断开；客户端不得把它当作普通网络错误重试原请求。
// The old connection receives this notice before it is closed after a newer
// login takes over; clients must not retry the old request as a normal error.
// @ets.msg protocol=Client method=SessionReplaced
message G2C_SessionReplaced // IMessage
{
  uint32 reason_code = 1;
  string reason = 2;
}

//ResponseType G2C_MapSnapshotReady
// 客户端完成地图对象和初始视野监听注册后确认；Gate随后请求MapHost发送初始快照。
// @ets.msg protocol=Gate method=MapSnapshotReady
message C2G_MapSnapshotReady // IRequest
{
  uint32 unit_id = 1;
}

message G2C_MapSnapshotReady // IResponse
{
  bool demo_door_closed = 1;
}

// @ets.msg protocol=Map method=Move duringTransfer=drop
message C2M_Move // IActorLocationMessage
{
  sint32 input_x = 1;
  sint32 input_z = 2;
  uint32 sequence = 3;
}

//ResponseType M2C_MapProbe
// @ets.msg protocol=Map method=Probe duringTransfer=reject
message C2M_MapProbe // IActorLocationRequest
{
  uint32 sequence = 1;
}

message M2C_MapProbe // IActorLocationResponse
{
  uint32 sequence = 1;
}

//ResponseType M2C_FindPath
// 只查询服务端NavMesh路径，不修改玩家权威位置；持续移动由独立的3D移动协议负责。
// @ets.msg protocol=Map method=FindPath duringTransfer=reject
message C2M_FindPath // IActorLocationRequest
{
  float start_x = 1;
  float start_y = 2;
  float start_z = 3;
  float target_x = 4;
  float target_y = 5;
  float target_z = 6;
}

message M2C_FindPath // IActorLocationResponse
{
  repeated NavigationPathPoint points = 1;
}

//ResponseType M2C_NavigateTo
// 设置NavMesh3D权威移动目标；Rust一次寻路并持有路径，TS不保存跨帧路径状态。
// @ets.msg protocol=Map method=NavigateTo duringTransfer=reject
message C2M_NavigateTo // IActorLocationRequest
{
  float target_x = 1;
  float target_y = 2;
  float target_z = 3;
  uint32 sequence = 4;
}

message M2C_NavigateTo // IActorLocationResponse
{
  uint32 acknowledged_sequence = 1;
  repeated NavigationPathPoint points = 2;
}

//ResponseType M2C_NavigateInput
// 提交相对角色朝向的方向输入；零输入会立即停止Rust持有的路径。
// @ets.msg protocol=Map method=NavigateInput duringTransfer=reject
message C2M_NavigateInput // IActorLocationRequest
{
  sint32 forward = 1;
  sint32 strafe = 2;
  float yaw = 3;
  uint32 sequence = 4;
}

message M2C_NavigateInput // IActorLocationResponse
{
  uint32 acknowledged_sequence = 1;
  repeated NavigationPathPoint points = 2;
}

//ResponseType M2C_ToggleDemoDoor
// Cocos3D灰盒只提交开关门意图；地图业务将其转换为稳定ObstacleId的动态导航障碍。
// @ets.msg protocol=Map method=ToggleDemoDoor duringTransfer=reject
message C2M_ToggleDemoDoor // IActorLocationRequest
{
  bool closed = 1;
}

message M2C_ToggleDemoDoor // IActorLocationResponse
{
  bool closed = 1;
  bool changed = 2;
}

// @ets.msg protocol=Client method=EntityMove
// @ets.broadcast mode=latest item=CellMovementState items=movements key=unit_id tick=server_tick
message G2C_EntityMove // IMessage
{
  uint32 server_tick = 1;
  repeated CellMovementState movements = 2;
}

// @ets.msg protocol=Client method=EntityNavigate
// @ets.broadcast mode=latest item=NavigationMovementState items=movements key=unit_id tick=server_tick
message G2C_EntityNavigate // IMessage
{
  uint32 server_tick = 1;
  repeated NavigationMovementState movements = 2;
}

// @ets.msg protocol=Client method=EntityNumeric
// @ets.broadcast mode=latest item=UnitNumericDelta items=numerics key=unit_id,numeric_type tick=server_tick
message G2C_EntityNumeric // IMessage
{
  uint32 server_tick = 1;
  repeated UnitNumericDelta numerics = 2;
}

// @ets.msg protocol=Client method=EntityState
// @ets.broadcast mode=latest item=UnitStateDelta items=states key=unit_id tick=server_tick
message G2C_EntityState // IMessage
{
  uint32 server_tick = 1;
  repeated UnitStateDelta states = 2;
}

//ResponseType M2C_UseItem
// @ets.msg protocol=Map method=UseItem duringTransfer=queue
message C2M_UseItem // IActorLocationRequest
{
  uint64 item_id = 1;
  // 一次逻辑使用操作的稳定ID；客户端重试必须复用，新操作必须重新生成。
  // Stable ID for one logical use operation; retries reuse it and new uses generate another.
  string operation_id = 2;
}

message M2C_UseItem // IActorLocationResponse
{
  ItemSnapshot item = 1;
  // 对本人返回这次Action新增的公开Buff；AOI事件仍然负责向其他观察者广播。
  // Returns the public Buff added by this Action to the owner; the AOI event still broadcasts it to observers.
  optional BuffPublicView buff = 2;
  uint64 global_cooldown_end_at_ms = 3;
  uint64 item_cooldown_end_at_ms = 4;
}

//ResponseType M2C_AttackMonster
// 简单怪物演示的攻击入口；伤害结算在地图的MonsterComponent中完成。
// @ets.msg protocol=Map method=AttackMonster duringTransfer=queue
message C2M_AttackMonster // IActorLocationRequest
{
  uint32 monster_id = 1;
}

message M2C_AttackMonster // IActorLocationResponse
{
  uint32 monster_id = 1;
  // 伤害使用uint64，保持Rust/TS的i64/bigint精度，不在服务端先窄化为number。
  // Damage uses uint64 so Rust/TS i64/bigint precision is preserved without
  // narrowing on the server before encoding.
  uint64 damage = 2;
  uint64 remaining_hp = 3;
  bool killed = 4;
}

//ResponseType M2C_LootMonster
// 摸取已经死亡的怪物尸体；服务端先提交背包事务，再返回受影响的堆叠。
// Loots a dead monster corpse. The server commits the inventory transaction before returning affected stacks.
// @ets.msg protocol=Map method=LootMonster duringTransfer=queue
message C2M_LootMonster // IActorLocationRequest
{
  uint32 monster_id = 1;
  // 同一轮拾取重试必须复用此ID，不能因为ACK丢失而再次生成奖励。
  // Retries of one loot attempt must reuse this ID so a lost ACK cannot duplicate rewards.
  string operation_id = 2;
  // 普通拾取只提交一行；drop_id为0时兼容旧客户端的“全部拾取”语义。
  // Normal pickup submits one row; drop_id=0 preserves legacy "loot all" behavior.
  uint32 drop_id = 3;
  // Shift/右键/F使用全部拾取；服务端仍按玩家资格过滤掉落。
  // Shift/right-click/F requests all eligible rows; the server still filters by player eligibility.
  bool loot_all = 4;
}

message M2C_LootMonster // IActorLocationResponse
{
  uint32 monster_id = 1;
  repeated ItemSnapshot items = 2;
  repeated QuestSnapshot quests = 3;
  // 领取后该玩家还能看到的掉落；客户端据此保持尸体窗口，不靠本地猜测。
  // Rows still visible to this player after pickup; clients keep the corpse window from this authoritative list.
  repeated LootDropSnapshot remaining_drops = 4;
}

//ResponseType M2C_InspectLootMonster
// 只查看死亡尸体，不改变掉落归属、不创建ItemId，也不提交数据库事务。
// Inspecting a dead corpse changes no ownership, creates no ItemId, and commits no database transaction.
// @ets.msg protocol=Map method=InspectLootMonster duringTransfer=queue
message C2M_InspectLootMonster // IActorLocationRequest
{
  uint32 monster_id = 1;
}

message M2C_InspectLootMonster // IActorLocationResponse
{
  uint32 monster_id = 1;
  repeated LootDropSnapshot drops = 2;
}

//ResponseType M2C_ToggleAutoAttack
// 平A开关只改变玩家意图；实际读条由地图的10Hz战斗桶推进，状态事件由Map广播给玩家本人。
// @ets.msg protocol=Map method=ToggleAutoAttack duringTransfer=reject
message C2M_ToggleAutoAttack // IActorLocationRequest
{
  bool enabled = 1;
  uint32 target_unit_id = 2;
}

message M2C_ToggleAutoAttack // IActorLocationResponse
{
  bool enabled = 1;
  uint32 target_unit_id = 2;
  uint32 phase = 3;
  uint64 swing_start_at_ms = 4;
  uint32 swing_interval_ms = 5;
}

// 平A状态是每个玩家的一份可覆盖状态；客户端用最新状态中的服务器时间计算进度，不依赖本地计时起点。
// @ets.msg protocol=Client method=AutoAttackState
// @ets.broadcast mode=latest
message G2C_AutoAttackState // IMessage
{
  bool enabled = 1;
  uint32 target_unit_id = 2;
  uint32 phase = 3;
  uint64 swing_start_at_ms = 4;
  uint32 swing_interval_ms = 5;
}

// @ets.msg protocol=Client method=ItemChanged
// @ets.broadcast mode=event
message G2C_ItemChanged // IMessage
{
  ItemSnapshot item = 1;
}

//ResponseType M2C_AcceptQuest
// 接取属于不可重复的玩家事实，进入PlayerUnit有序mailbox。
// @ets.msg protocol=Map method=AcceptQuest duringTransfer=queue
message C2M_AcceptQuest // IActorLocationRequest
{
  uint32 quest_config_id = 1;
  uint32 npc_unit_id = 2;
}

message M2C_AcceptQuest // IActorLocationResponse
{
  QuestSnapshot quest = 1;
}

//ResponseType M2C_CompleteQuest
// 领奖与移除进行中任务在同一同步调用栈提交，重复请求必须失败且不得重复发奖。
// @ets.msg protocol=Map method=CompleteQuest duringTransfer=queue
message C2M_CompleteQuest // IActorLocationRequest
{
  uint32 quest_config_id = 1;
  uint32 npc_unit_id = 2;
}

message M2C_CompleteQuest // IActorLocationResponse
{
  uint32 quest_config_id = 1;
  repeated ItemSnapshot reward_items = 2;
}

// 任务进度是本人可见的可覆盖状态；同一任务只保留队列中的最新revision。
// @ets.msg protocol=Client method=QuestProgress
// @ets.broadcast mode=latest item=QuestSnapshot items=quests key=quest_config_id
message G2C_QuestProgress // IMessage
{
  repeated QuestSnapshot quests = 1;
}

// Buff创建是不可覆盖事件；普通AOI玩家、自己和队伍成员都只从这里获得公开外观。
// @ets.msg protocol=Client method=BuffAdded
// @ets.broadcast mode=event
message G2C_BuffAdded // IMessage
{
  BuffPublicView buff = 1;
}

// Buff移除是不可覆盖事件；客户端用revision拒绝迟到的详情状态。
// @ets.msg protocol=Client method=BuffRemoved
// @ets.broadcast mode=event
message G2C_BuffRemoved // IMessage
{
  uint32 unit_id = 1;
  uint64 buff_instance_id = 2;
  uint32 revision = 3;
}

// 吸收量等私有详情允许帧内覆盖，只发给自己、队友或团队成员。
// @ets.msg protocol=Client method=BuffDetail
// @ets.broadcast mode=latest item=BuffDetailView items=buffs key=unit_id,buff_instance_id tick=server_tick
message G2C_BuffDetail // IMessage
{
  uint32 server_tick = 1;
  repeated BuffDetailView buffs = 2;
}

// @ets.msg protocol=Client method=EntityEnter
// @ets.broadcast mode=event
message G2C_EntityEnter // IMessage
{
  MapEntitySnapshot entity = 1;
}

// @ets.msg protocol=Client method=EntityLeave
// @ets.broadcast mode=event
message G2C_EntityLeave // IMessage
{
  uint32 unit_id = 1;
}

// @ets.msg protocol=Client method=AoiDelta
// @ets.broadcast mode=event
message G2C_AoiDelta // IMessage
{
  uint32 server_tick = 1;
  repeated MapEntitySnapshot enters = 2;
  repeated uint32 leaves = 3;
}

// @ets.msg protocol=Client method=DemoDoorState
// @ets.broadcast mode=event
message G2C_DemoDoorState // IMessage
{
  bool closed = 1;
}

//ResponseType M2C_CastSkill
// 技能请求进入PlayerUnit有序mailbox；读条完成与弹道命中由地图10Hz技能桶推进。
// @ets.msg protocol=Map method=CastSkill duringTransfer=reject
message C2M_CastSkill // IActorLocationRequest
{
  uint32 skill_id = 1;
  uint32 target_unit_id = 2;
}

message M2C_CastSkill // IActorLocationResponse
{
  uint32 phase = 1;
  uint64 cast_id = 2;
  uint32 skill_id = 3;
  uint32 target_unit_id = 4;
  uint64 started_at_ms = 5;
  uint64 finish_at_ms = 6;
  uint64 global_cooldown_end_at_ms = 7;
  uint64 skill_cooldown_end_at_ms = 8;
  string interrupt_reason = 9;
  uint32 channel_tick_index = 10;
  uint32 channel_tick_count = 11;
  uint32 queued_skill_id = 12;
  uint32 queued_target_unit_id = 13;
  uint64 queue_deadline_at_ms = 14;
}

// 施法状态只发给本人；移动打断、完成和失败都用新状态覆盖旧读条。
// @ets.msg protocol=Client method=SkillCastState
// @ets.broadcast mode=latest
message G2C_SkillCastState // IMessage
{
  uint32 phase = 1;
  uint64 cast_id = 2;
  uint32 skill_id = 3;
  uint32 target_unit_id = 4;
  uint64 started_at_ms = 5;
  uint64 finish_at_ms = 6;
  uint64 global_cooldown_end_at_ms = 7;
  uint64 skill_cooldown_end_at_ms = 8;
  string interrupt_reason = 9;
  uint32 channel_tick_index = 10;
  uint32 channel_tick_count = 11;
  uint32 queued_skill_id = 12;
  uint32 queued_target_unit_id = 13;
  uint64 queue_deadline_at_ms = 14;
}

// 弹道创建是不可覆盖事件；客户端只负责表现，伤害仍由服务端到点结算。
// @ets.msg protocol=Client method=SkillProjectile
// @ets.broadcast mode=event
message G2C_SkillProjectile // IMessage
{
  uint64 cast_id = 1;
  uint32 skill_id = 2;
  uint32 source_unit_id = 3;
  uint32 target_unit_id = 4;
  uint64 launched_at_ms = 5;
  uint64 impact_at_ms = 6;
}

// 一次技能命中的公开结果；详细Buff仍由BuffAdded/BuffRemoved维护。
// @ets.msg protocol=Client method=SkillImpact
// @ets.broadcast mode=event
message G2C_SkillImpact // IMessage
{
  uint64 cast_id = 1;
  uint32 skill_id = 2;
  uint32 source_unit_id = 3;
  uint32 target_unit_id = 4;
  uint64 damage = 5;
  uint32 damage_school = 6;
  bool killed = 7;
}

//ResponseType G2C_Ping
// @ets.msg protocol=Gate method=Ping
message C2G_Ping // IRequest
{
}

message G2C_Ping // IResponse
{
  // Gate生成响应时的Unix毫秒时间。
  int64 server_time = 1;
}
