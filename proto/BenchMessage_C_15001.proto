syntax = "proto3";

package ets.bench;

// 64-bit codec compatibility fixture. It is a data structure and therefore has no opcode.
message Integer64Fixture
{
  uint64 unsigned_value = 1;
  int64 signed_value = 2;
  repeated uint64 unsigned_values = 3;
  repeated int64 signed_values = 4;
}

//ResponseType S2C_RuntimePing
// @ets.msg protocol=Bench
message C2S_RuntimePing // IRequest
{
  uint32 seq = 1;
  bytes payload = 2;
  uint32 delay_ms = 3;
}

message S2C_RuntimePing // IResponse
{
  uint32 seq = 1;
  bytes payload = 2;
}

//ResponseType S2C_MailboxParity
// @ets.msg protocol=MailboxParity
message C2S_MailboxParity // IRequest
{
  uint32 call_count = 1;
  uint32 delay_ms = 2;
}

message S2C_MailboxParity // IResponse
{
  uint32 elapsed_ms = 1;
  uint32 max_server_concurrency = 2;
}

//ResponseType M2C_StateSyncBench
// @ets.msg protocol=StateSyncBench method=Trigger
message C2M_StateSyncBench // IActorLocationRequest
{
  // 1=Numeric, 2=PlayerInfo, 3=Item
  uint32 mode = 1;
  uint32 sequence = 2;
}

message M2C_StateSyncBench // IActorLocationResponse
{
  uint32 mode = 1;
  uint32 sequence = 2;
}

//ResponseType M2C_MapCapacityPlace
// @ets.msg protocol=MapCapacityBench method=Place
message C2M_MapCapacityPlace // IActorLocationRequest
{
  // Zero-based virtual-player index assigned by the load generator.
  uint32 player_index = 1;
  // 1=uniform across every AOI Grid, 2=one AOI Grid with direction-safe anchors.
  uint32 layout = 2;
}

message M2C_MapCapacityPlace // IActorLocationResponse
{
  uint32 player_index = 1;
  sint32 cell_x = 2;
  sint32 cell_z = 3;
}

//ResponseType G2C_MapCapacityEnter
// @ets.msg protocol=MapCapacityBench method=Enter
message C2G_MapCapacityEnter // IRequest
{
  uint32 map_id = 1;
  uint32 player_index = 2;
  // 1=uniform across every AOI Grid, 2=one AOI Grid with direction-safe anchors.
  uint32 layout = 3;
}

message G2C_MapCapacityEnter // IResponse
{
  uint32 unit_id = 1;
  sint32 cell_x = 2;
  sint32 cell_z = 3;
}
