syntax = "proto3";

package ets.demo;

message MapEntitySnapshot
{
  uint32 unit_id = 1;
  float x = 2;
  float y = 13;
  float z = 3;
  float yaw = 4;
  bool alive = 5;
  bytes state = 6;
  string account = 7;
  sint32 cell_x = 8;
  sint32 cell_z = 9;
  repeated UnitNumericDelta numerics = 10;
  float speed_cells_per_second = 11;
  uint32 facing = 12;
  repeated BuffPublicView buffs = 14;
  // 1玩家，2怪物，3 NPC；客户端据此选择展示模板。 / 1=player, 2=monster, 3=NPC; clients use this to select a presentation template.
  uint32 entity_type = 15;
  // 玩家配置ID或怪物配置ID；不承载运行时状态。 / PlayerConfigId or MonsterConfigId; this is not runtime state.
  uint32 config_id = 16;
  // 世界空间头顶HUD使用的公开名称；不把账号、配置ID或本地化逻辑交给客户端猜测。 / Public world-space display name for overhead HUDs; clients must not infer it from account or config IDs.
  string display_name = 17;
  // NPC是否提供商店交互；客户端只据此显示入口，价格和权限仍由服务端校验。 / Whether an NPC exposes a shop entry; the server still validates prices and permission.
  bool shop_enabled = 18;
}

message CellMovementState
{
  uint32 unit_id = 1;
  uint32 acknowledged_sequence = 2;
  sint32 from_cell_x = 3;
  sint32 from_cell_z = 4;
  sint32 to_cell_x = 5;
  sint32 to_cell_z = 6;
  uint32 move_start_tick = 7;
  uint32 move_end_tick = 8;
  bool moving = 9;
  uint32 facing = 10;
}

// NavMesh查询返回的米制世界坐标；它是普通协议数据，不暴露引擎Vector3或Detour句柄。
message NavigationPathPoint
{
  float x = 1;
  float y = 2;
  float z = 3;
}

// NavMesh3D连续移动的权威状态；坐标是玩家脚底在地图局部空间中的米制位置。
message NavigationMovementState
{
  uint32 unit_id = 1;
  uint32 acknowledged_sequence = 2;
  float x = 3;
  float y = 4;
  float z = 5;
  float yaw = 6;
  bool moving = 7;
}

message UnitNumericDelta
{
  uint32 unit_id = 1;
  uint32 numeric_type = 2;
  int64 value = 3;
}

message UnitStateDelta
{
  uint32 unit_id = 1;
  uint32 dirty_mask_low = 2;
  uint32 dirty_mask_high = 3;
  float x = 4;
  float y = 5;
  float speed_cells_per_second = 6;
  bool alive = 7;
  float z = 8;
  float yaw = 9;
}

message ItemSnapshot
{
  uint64 item_id = 1;
  uint32 config_id = 2;
  uint32 count = 3;
  uint32 quality = 4;
  uint32 level = 5;
  uint32 version = 6;
}

// 背包权威全量快照；包装层存在但items为空时，明确表示玩家当前背包为空。
// Authoritative full inventory snapshot; an existing empty wrapper explicitly means the inventory is empty.
message InventorySnapshot
{
  repeated ItemSnapshot items = 1;
}

// NPC商店的一行静态商品；购买数量、金币和库存仍由服务端事务决定。
// One static NPC-shop row; count, gold, and inventory are still decided by a server transaction.
message ShopItemSnapshot
{
  uint32 item_config_id = 1;
  uint64 buy_price = 2;
  uint64 sell_price = 3;
}

// 玩家交易中的一条具体道具报价；item_id决定扣除哪一个永久Item实体。
// One concrete item offer in a player trade; item_id identifies the persistent Item entity to debit.
message PlayerTradeItemOffer
{
  uint64 item_id = 1;
  uint32 item_config_id = 2;
  uint32 count = 3;
}

// 一方的公开报价；只包含本次愿意交换的金币与道具，不泄露完整背包。
// One participant's public offer containing only the gold and items offered in this trade.
message PlayerTradeParticipant
{
  uint32 unit_id = 1;
  string display_name = 2;
  uint64 gold = 3;
  repeated PlayerTradeItemOffer items = 4;
  bool confirmed = 5;
}

// 地图内临时交易状态；phase: 1邀请中，2交换中，3提交中，4已关闭。
// Map-local ephemeral trade state; phase: 1=invited, 2=open, 3=committing, 4=closed.
message PlayerTradeSnapshot
{
  string trade_id = 1;
  PlayerTradeParticipant requester = 2;
  PlayerTradeParticipant target = 3;
  uint32 phase = 4;
  uint64 expire_at_ms = 5;
}

// 一行尸体掉落预览；只公开当前玩家有资格领取的配置和数量，不提前创建ItemId。
// One corpse-loot preview row. It exposes only eligible config/count data and never allocates an ItemId early.
message LootDropSnapshot
{
  uint32 drop_id = 1;
  uint32 item_config_id = 2;
  uint32 count = 3;
  // 非零时该行表示铜币掉落，item_config_id和count保持0。 / A non-zero value represents currency loot; item_config_id and count remain zero.
  uint64 gold = 4;
}

// 玩家个人副本CD属于成长持久状态；operation_id用于重试同一次已接受的进入请求。
// Personal dungeon cooldown is persisted progression state; operation_id makes one accepted entry retryable.
message StarterDungeonCooldownSnapshot
{
  uint64 cooldown_end_at_ms = 1;
  string operation_id = 2;
}

// 周围玩家可见的Buff外观数据；不得包含吸收量等私有战斗细节。
message BuffPublicView
{
  uint32 unit_id = 1;
  uint64 buff_instance_id = 2;
  uint32 buff_config_id = 3;
  uint32 stacks = 4;
  uint64 expire_time_ms = 5;
  uint32 revision = 6;
}

// 仅自己、队友或团队成员可见的Buff详情；与公开视图独立合并。
message BuffDetailView
{
  uint32 unit_id = 1;
  uint64 buff_instance_id = 2;
  uint32 absorb_remaining = 3;
  uint32 revision = 4;
}

// 地图传送使用的Buff纯值快照；目标进程会按墙钟剩余时间重新创建Timer。
message BuffTransferSnapshot
{
  uint64 buff_instance_id = 1;
  uint32 buff_config_id = 2;
  uint32 stacks = 3;
  uint64 applied_at_ms = 4;
  uint64 expire_time_ms = 5;
  uint32 tick_interval_ms = 6;
  uint64 next_tick_at_ms = 7;
  uint32 revision = 8;
  uint32 source_unit_id = 9;
  uint32 source_ability_id = 10;
  uint32 conflict_priority = 11;
  uint64 damage_absorber_remaining = 12;
  int32 add_action_type = 13;
  repeated int64 add_action_params = 14;
  int32 tick_action_type = 15;
  repeated int64 tick_action_params = 16;
  int32 remove_action_type = 17;
  repeated int64 remove_action_params = 18;
}

message SkillCooldownSnapshot
{
  uint32 skill_id = 1;
  uint64 cooldown_end_at_ms = 2;
}

message ItemCooldownSnapshot
{
  uint32 item_config_id = 1;
  uint64 cooldown_end_at_ms = 2;
}

// 地图传送保留技能、道具和共享GCD；活动读条不会跨地图恢复。
message SkillTransferSnapshot
{
  uint64 global_cooldown_end_at_ms = 1;
  repeated SkillCooldownSnapshot cooldowns = 2;
  repeated ItemCooldownSnapshot item_cooldowns = 3;
}

// 单个任务目标的权威进度；required由接取时快照固定，不随在线热配置追溯变化。
message QuestObjectiveSnapshot
{
  uint32 objective_id = 1;
  uint32 current = 2;
  uint32 required = 3;
}

// 一个进行中任务的可覆盖状态；接取和领奖是RPC事实，不使用latest表达。
message QuestSnapshot
{
  uint32 quest_config_id = 1;
  repeated QuestObjectiveSnapshot objectives = 2;
  uint32 revision = 3;
  // 兼容旧SDK；新业务只读取status，生成快照时保持两者一致。
  bool ready_to_complete = 4;
  // 1=InProgress, 2=ReadyToTurnIn；领奖后任务从活动快照移除。
  uint32 status = 5;
}
