name: tiangz-observability-production

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: tiangz-observe-prometheus
    restart: unless-stopped
    network_mode: host
    mem_limit: 768m
    logging: *bounded-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=14d
      - --storage.tsdb.retention.size=12GB
      - --web.listen-address=127.0.0.1:19090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/targets.yml:/etc/prometheus/targets.yml:ro
      - ../prometheus/rules/tiangz.yml:/etc/prometheus/rules/tiangz.yml:ro
      - ./prometheus/production-rules.yml:/etc/prometheus/rules/production.yml:ro
      - prometheus-data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: tiangz-observe-alertmanager
    restart: unless-stopped
    network_mode: host
    mem_limit: 128m
    logging: *bounded-logging
    command:
      - --config.file=/etc/alertmanager/${ALERTMANAGER_CONFIG:-alertmanager.yml}
      - --storage.path=/alertmanager
      - --data.retention=336h
      - --web.listen-address=127.0.0.1:19093
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager

  loki:
    image: grafana/loki:3.5.3
    container_name: tiangz-observe-loki
    restart: unless-stopped
    network_mode: host
    mem_limit: 1024m
    logging: *bounded-logging
    command:
      - -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

  tempo:
    image: grafana/tempo:2.8.2
    container_name: tiangz-observe-tempo
    restart: unless-stopped
    network_mode: host
    mem_limit: 768m
    logging: *bounded-logging
    command:
      - -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo

  alloy:
    image: grafana/alloy:v1.10.2
    container_name: tiangz-observe-alloy
    restart: unless-stopped
    network_mode: host
    mem_limit: 384m
    logging: *bounded-logging
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/log/tiangz-chaos/runtime:/var/log/tiangz:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - alloy-data:/var/lib/alloy
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:12.1.1
    container_name: tiangz-observe-grafana
    restart: unless-stopped
    network_mode: host
    mem_limit: 512m
    logging: *bounded-logging
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: 13001
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:?GRAFANA_ROOT_URL is required}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/provisioning/dashboards/files:/var/lib/grafana/dashboards/runtime:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards/production:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
      - alertmanager

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: tiangz-observe-node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    mem_limit: 128m
    logging: *bounded-logging
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --web.listen-address=127.0.0.1:19100
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: tiangz-observe-postgres-exporter
    restart: unless-stopped
    network_mode: host
    mem_limit: 192m
    logging: *bounded-logging
    environment:
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DSN:?POSTGRES_EXPORTER_DSN is required}
    command:
      - --web.listen-address=127.0.0.1:19187

  redis-exporter:
    image: oliver006/redis_exporter:v1.77.0
    container_name: tiangz-observe-redis-exporter
    restart: unless-stopped
    network_mode: host
    mem_limit: 128m
    logging: *bounded-logging
    environment:
      REDIS_ADDR: ${REDIS_EXPORTER_URL:?REDIS_EXPORTER_URL is required}
    command:
      - --web.listen-address=127.0.0.1:19121

volumes:
  prometheus-data:
  alertmanager-data:
  loki-data:
  tempo-data:
  alloy-data:
  grafana-data:
