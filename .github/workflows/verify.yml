name: verify

on:
  push:
  pull_request:

jobs:
  framework:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: npm install
      - name: Rust format check
        run: cargo fmt --all -- --check
      - name: Rust Clippy warnings
        run: cargo clippy --all-targets -- -D warnings
      # test:module-host 会启动仓库根的调试宿主；矩阵里的 cargo 编译排在它之后，必须先构建。
      # test:module-host launches the debug host from the repository root; the matrix compiles Rust later, so build it first.
      - name: Build the debug host
        run: npm run build:runtime:debug
      - run: npm run verify
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-failure-logs-${{ matrix.os }}
          path: temp/test-logs/
          if-no-files-found: ignore
      - name: Report development lock drift
        run: npm run verify:locks:warn
      - run: npm run release:package
      - uses: actions/upload-artifact@v4
        with:
          name: TiangZ-${{ matrix.os }}
          path: dist/release/
