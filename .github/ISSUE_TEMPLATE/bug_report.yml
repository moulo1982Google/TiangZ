name: 缺陷报告 / Bug report
description: 报告一个可复现的问题（安全问题请不要在这里提交）
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        安全漏洞请不要在这里提交，见仓库的 SECURITY.md。
        Do not report security vulnerabilities here; see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: 版本 / Version
      description: TiangZ 版本或提交，例如 0.7.4
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境 / Environment
      description: 操作系统、Node 与 Rust 版本
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望的行为 / Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际的行为 / Actual
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 最好是能直接运行的命令或最小示例
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / Logs
      description: 请去掉密码、令牌等敏感信息
      render: text
