name: 功能建议 / Feature request
description: 提出新功能或改进（改协议或 Stable API 的改动请先在这里讨论）
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题 / Problem
      description: 先说场景和痛点，再说方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法 / Proposal
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他做法 / Alternatives
  - type: dropdown
    id: scope
    attributes:
      label: 涉及的范围 / Scope
      multiple: true
      options:
        - Core（TypeScript）
        - Rust 运行时
        - 协议或客户端 SDK
        - 工具与脚手架
        - 文档
        - 其他
