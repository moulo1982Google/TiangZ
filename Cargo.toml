[package]
name = "TiangZ"
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/moulo1982Google/TiangZ"
default-run = "TiangZ"

[lib]
name = "tiangz_transport"
path = "src/transport_lib.rs"

[features]
default = ["mimalloc-allocator"]
mimalloc-allocator = ["dep:mimalloc"]
io-uring = ["dep:tokio-uring"]
kcp = []

[dependencies]
anyhow = "1"
base64 = "0.23"
bytes = "1"
deno_core = "0.410"
deno_error = "0.7.1"
deno_inspector_server = "0.31.0"
futures-util = "0.3"
opentelemetry = { version = "0.32.0", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls", "trace"] }
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.30"
tiangz-dbproxy-client = { git = "https://github.com/moulo1982Google/TiangZ-DBProxy.git", branch = "main" }
tiangz-dbproxy-core = { git = "https://github.com/moulo1982Google/TiangZ-DBProxy.git", branch = "main" }
tiangz-dbproxy-protocol = { git = "https://github.com/moulo1982Google/TiangZ-DBProxy.git", branch = "main" }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
mimalloc = { version = "0.1.52", optional = true }
rustc-hash = "2"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[target.'cfg(target_os = "linux")'.dependencies]
tokio-uring = { version = "0.5.0", optional = true }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cc = "1"
