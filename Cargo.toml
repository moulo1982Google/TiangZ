[package]
name = "TiangZ"
version = "0.3.10-alpha.4"
edition = "2024"
default-run = "TiangZ"

[lib]
name = "tiangz_transport"
path = "src/transport_lib.rs"

[features]
default = ["mimalloc-allocator"]
mimalloc-allocator = ["dep:mimalloc"]
io-uring = ["dep:tokio-uring"]
kcp = []

[dependencies]
anyhow = "1"
base64 = "0.23"
bytes = "1"
deno_core = "0.409"
deno_error = "0.7.1"
deno_inspector_server = "0.30.0"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.30"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
mimalloc = { version = "0.1.52", optional = true }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[target.'cfg(target_os = "linux")'.dependencies]
tokio-uring = { version = "0.5.0", optional = true }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cc = "1"
